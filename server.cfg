// QuakeJS dedicated server config — EDIT THIS FILE to change the map / rules.
// It is mounted into the container (see docker-compose.yml), so after editing:
//     docker compose restart quakejs      (or: docker compose up -d)
// No image rebuild needed.
//
// ─────────────────────────────────────────────────────────────────────────
//  CHANGE THE MAP
// ─────────────────────────────────────────────────────────────────────────
//  Option A — single fixed map: set it here and delete/comment the rotation
//  block at the bottom. Example fixed map:
//        set nextmap ""
//        map q3dm17
//
//  Option B — rotation (default below): the server cycles through the maps.
//
//  Maps ACTUALLY baked into this image (only these can be hosted):
//     q3dm1  q3dm7  q3dm9  q3dm17        (free-for-all / team deathmatch)
//     q3tourney2                          (1v1 duel, also fine for FFA)
//     q3tourney6_ctf                      (CTF — needs g_gametype 4)
//  Other names (q3dm0, q3ctf1, etc.) are NOT present and will fail to load.
//
//  You can also change the map LIVE from the in-game console (see README):
//        \rconpassword changeme_rcon
//        \rcon map q3dm17

seta sv_hostname "quakejs LAN"
seta sv_maxclients 12
seta g_motd "Welcome to the Local baseq3 QuakeJS Server"

// ── Game rules ──
seta g_gametype 0            // 0=FFA 1=tournament 3=team-DM 4=CTF
seta timelimit 15            // minutes (0 = no time limit)
seta fraglimit 25            // frags to end the round (0 = none)
seta g_quadfactor 3
seta g_weaponrespawn 3
seta g_inactivity 3000
seta g_forcerespawn 0

// ── CHANGE THIS ── rcon lets you run server commands from a client console.
seta rconpassword "changeme_rcon"

// ── Smoothness / network ──
// sv_fps is the server tick rate. 20 is stock and gives the (single-threaded,
// emscripten) server the most headroom, which matters when fighting ping
// spikes / frame hitches. Try 30 for smoother movement ONLY if pings stay flat.
seta sv_fps 20
// Let clients use a high rate so snapshots aren't throttled on a fast LAN.
seta sv_maxRate 25000
seta sv_dlRate 100
seta sv_floodProtect 1

// ── Map rotation (Option B). Comment this whole block out if using a fixed map. ──
// Only maps actually baked into this image are used (see the map list above).
set d1 "map q3dm1 ; set nextmap vstr d2"
set d2 "map q3dm7 ; set nextmap vstr d3"
set d3 "map q3dm17 ; set nextmap vstr d4"
set d4 "map q3dm9 ; set nextmap vstr d5"
set d5 "map q3tourney2 ; set nextmap vstr d1"
vstr d1
